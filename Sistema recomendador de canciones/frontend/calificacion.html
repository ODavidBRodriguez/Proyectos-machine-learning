<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calificar Canción</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .star-rating {
      font-size: 2rem;
      cursor: pointer;
      color: #ddd;
    }
    .star-rating .star:hover,
    .star-rating .star.active {
      color: #ffc107;
    }
  </style>
</head>
<body class="bg-light">
  <div class="container py-5 text-center">
    <h3>⭐ Calificar Canción</h3>
    <p id="song-info" class="mb-4 fs-5"></p>
    
    <div class="mb-3">
      <label class="form-label">Selecciona tu calificación:</label>
      <div class="star-rating" id="starRating">
        <span class="star" data-rating="1">★</span>
        <span class="star" data-rating="2">★</span>
        <span class="star" data-rating="3">★</span>
        <span class="star" data-rating="4">★</span>
        <span class="star" data-rating="5">★</span>
      </div>
      <small class="text-muted" id="rating-text">Sin calificar</small>
    </div>
    
    <input type="hidden" id="rating" value="0">
    <button class="btn btn-success mt-3" onclick="sendRating()" id="submit-btn" disabled>
      Enviar Calificación
    </button>
  </div>

  <script src="script.js"></script>
  <script>
    // Sistema de estrellas
    const stars = document.querySelectorAll('.star');
    const ratingInput = document.getElementById('rating');
    const ratingText = document.getElementById('rating-text');
    const submitBtn = document.getElementById('submit-btn');
    
    stars.forEach(star => {
      star.addEventListener('click', function() {
        const rating = this.getAttribute('data-rating');
        ratingInput.value = rating;
        
        // Actualizar estrellas visualmente
        stars.forEach(s => {
          s.classList.toggle('active', s.getAttribute('data-rating') <= rating);
        });
        
        // Actualizar texto
        ratingText.textContent = `${rating} estrella${rating > 1 ? 's' : ''}`;
        submitBtn.disabled = false;
      });
    });

    // Mostrar información de la canción
    const params = new URLSearchParams(window.location.search);
    const songId = params.get("song_id");
    if (songId) {
      document.getElementById("song-info").innerText = `Estás calificando la canción #${songId}`;
    }
  </script>
</body>
</html>
