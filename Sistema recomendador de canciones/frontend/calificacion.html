<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calificar Canción</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5 text-center">
    <h3>🎵 Calificar Canción</h3>
    <p id="song-info" class="mb-4"></p>
    <label for="rating">Selecciona tu calificación (1 a 5):</label>
    <input type="number" id="rating" min="1" max="5" class="form-control w-25 mx-auto my-3">
    <button class="btn btn-success" onclick="sendRating()">Enviar Calificación</button>
  </div>

  <script src="script.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const songId = params.get("song_id");
    if (songId) {
      document.getElementById("song-info").innerText = `Estás calificando la canción #${songId}`;
    }
  </script>
</body>
</html>
