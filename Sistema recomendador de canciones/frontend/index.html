<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Recomendador de canciones</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  
</head>
<body>
<div class="container py-5">

  <h2 class="text-center mb-5">Recomendador de canciones</h2>
  <p class="text-center fs-5 mb-5" id="user-classification"></p>
  <div id="alerta" class="alert alert-custom text-center d-none">Calificación enviada correctamente</div>

  <!-- Carrusel de canciones sin calificar -->
  <h4 class="mb-3">Hecha un vistazo a estas canciones</h4>
  <div id="songCarousel" class="carousel slide mb-5" data-bs-ride="carousel">
    <div class="carousel-inner" id="carousel-content"></div>
    <button class="carousel-control-prev" type="button" data-bs-target="#songCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#songCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>

  <!-- Canciones recomendadas -->
  <h4 class="mb-3">Recomendaciones para ti</h4>
  <div class="row" id="recommended"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="script.js"></script>
</body>
</html>
