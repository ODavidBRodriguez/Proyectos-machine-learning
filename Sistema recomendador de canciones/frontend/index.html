<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🎵 Sistema de Recomendación de Música</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #121212; color: #fff; }
    .song-card {
      background-color: #1e1e1e;
      border-radius: 15px;
      padding: 15px;
      text-align: center;
      transition: transform 0.2s;
    }
    .song-card:hover { transform: scale(1.05); cursor: pointer; }
    .carousel-inner img { border-radius: 15px; }
    .alert-custom {
      background-color: #1db954;
      color: white;
      border: none;
    }
  </style>
</head>
<body>
<div class="container py-5">

  <h2 class="text-center mb-5">🎧 Sistema de Recomendación de Música</h2>

  <div id="alerta" class="alert alert-custom text-center d-none">¡Calificación enviada correctamente!</div>

  <!-- 🎵 Carrusel de canciones sin calificar -->
  <h4 class="mb-3">Canciones por calificar</h4>
  <div id="songCarousel" class="carousel slide mb-5" data-bs-ride="carousel">
    <div class="carousel-inner" id="carousel-content"></div>
    <button class="carousel-control-prev" type="button" data-bs-target="#songCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#songCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>

  <!-- 🎯 Canciones recomendadas -->
  <h4 class="mb-3">Recomendaciones para ti</h4>
  <div class="row" id="recommended"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
