version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: k_means_backend
    # PUERTO CAMBIADO: 5001 en el host, 5000 en el contenedor
    ports:
      - "5001:5000" 
    environment:
      PYTHONUNBUFFERED: 1
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: k_means_frontend
    # PUERTO CAMBIADO: 8080 en el host, 80 en el contenedor
    ports:
      - "8080:80" 
    depends_on:
      - backend
    restart: always